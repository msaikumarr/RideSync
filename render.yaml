services:
  - type: web
    name: ridesync-backend
    runtime: node
    rootDir: backend
    plan: free
    buildCommand: npm install
    startCommand: npm start
    envVars:
      - key: MONGO_URI
        sync: false
      - key: JWT_SECRET
        generateValue: true
      - key: JWT_EXPIRES_IN
        value: 7d
      - key: SEPARATION_ALERT_KM
        value: "2"
      # Preferred email provider: Brevo's HTTPS API (see backend/.env.example).
      # Avoids the SMTP connection timeouts/blocks Gmail SMTP hits from Render.
      - key: BREVO_API_KEY
        sync: false
      - key: FROM_EMAIL
        sync: false
      # Fallback SMTP settings, only used if BREVO_API_KEY is not set.
      - key: SMTP_HOST
        value: smtp.gmail.com
      - key: SMTP_PORT
        value: "587"
      - key: SMTP_SECURE
        value: "false"
      - key: SMTP_USER
        sync: false
      - key: SMTP_PASS
        sync: false
      - key: FRONTEND_URL
        sync: false
      - key: MAX_RESET_ATTEMPTS
        value: "5"
      - key: RESET_LOCK_MINUTES
        value: "60"
